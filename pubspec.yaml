name: rambaa
description: "TURAME Healthcare App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  google_fonts: ^6.2.1
  flutter_screenutil: 5.9.3
  get_storage: ^2.1.1
  intl: ^0.19.0
  pinput: ^6.0.2
  rxdart: ^0.28.0
  vibration: ^3.1.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_messaging: ^16.4.1
  http: ^1.2.2
  intl_phone_number_input: ^0.7.4
  zego_uikit_prebuilt_call: ^4.17.13
  flutter_stripe: ^11.5.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  googleapis_auth: ^2.0.0
  path_provider: ^2.1.5
  open_wearables_health_sdk: ^0.0.20
  cloudinary: ^1.2.2
  image_picker: ^1.1.2
  health: ^13.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  zego_plugin_adapter: 2.13.9
  zego_express_engine: 3.21.0
  zego_callkit: 1.0.0+5
  zego_zpns: 2.8.0
  zego_uikit_signaling_plugin: 2.8.15
  zego_zim: 2.21.1+1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/App logo.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/service_account_key.json
